[package]
name = "velaterm"
version = "0.2.15"
description = "VelaTerm multi-session terminal manager"
authors = ["vlinx"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a known Windows conflict with the binary name.
name = "velaterm_lib"
# rlib only: staticlib/cdylib are the Tauri template's mobile outputs. No iOS/Android target exists, and
# producing them cost every build a ~300 MB static archive plus an extra dylib link.
crate-type = ["rlib"]

[features]
# GUI is enabled by default for the desktop app. Minimal vela-server builds use `--no-default-features`,
# omit Tauri/wry/WebKit and GUI modules, and retain CLI paths such as --serve/--version for clean servers.
# Shared pty/agent/web/db/command_core code has no Tauri dependency.
default = ["gui"]
# Opt-in mock runtime for native multi-window event-routing regression tests.
native-menu-tests = ["gui", "tauri/test"]
gui = [
    "dep:font-kit",
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-global-shortcut",
    # Pure-Rust russh transport required only by the GUI SSH client.
    "dep:russh",
    "dep:russh-sftp",
    # Linux GTK signal access for recovering the paths of files dropped from the file manager.
    "dep:gtk",
]
# Backend for the Electron shell on Linux: the headless server plus native font enumeration, with no
# Tauri/WebKit/GTK, so the packaged app runs on hosts without WebKitGTK. It keeps the desktop release
# identity (see `serve_identifier`) so it opens the same data directory the desktop app always used.
sidecar = ["dep:font-kit"]

[workspace]
# Domain crates live under crates/. Profiles stay in this root manifest: Cargo ignores them in members.
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
time = { version = "0.3", features = ["local-offset"] }
libc = "0.2"

[profile.dev]
debug = false

[profile.release]
# Strip desktop and minimal-server release artifacts without affecting development/debugging.
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Tao 0.35.3 predates the Windows input-lock reentrancy fix (tao#1215). The
# stable Tauri runtime still requires 0.35, so pin the compatible upstream fix.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "c704261c519c58cfdd0bc2d58ba24e06a0b71c92" }

# The pinned tree has an older Android path dependency. Preserve the published
# 0.1.4 JNI macro fixes instead of resolving that path's 0.1.3 implementation.
[patch."https://github.com/tauri-apps/tao"]
tao-macros = { version = "=0.1.4", registry = "crates-io" }

[dependencies]
vlx-core = { path = "crates/vlx-core" }
# Native font enumeration belongs to the display host, not the remote headless server.
font-kit = { version = "0.14.3", optional = true }
# The built-in browser needs unstable Window::add_child multi-WebView APIs. Their signatures may change,
# so the version is pinned within 2.11 and call sites are centralized.
# Default features minus `compression`: the frontend is embedded as plain bytes, because antivirus heuristics
# treat large compressed blobs inside an executable as a packed loader. The installer compresses it anyway.
tauri = { version = "2", default-features = false, features = [
    "wry", "common-controls-v6", "dynamic-acl", "x11", "dbus", "unstable", "image-png",
], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
# Remote wry windows use the clipboard plugin because macOS WebView rejects asynchronous gesture-free
# navigator.clipboard writes. Runtime capabilities authorize write_text in the remote context.
tauri-plugin-clipboard-manager = { version = "2", optional = true }
# Desktop updater checks latest.json, installs signed packages, and relaunches through the process plugin.
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
# A second `vela <path>` process forwards the path to the running window and exits immediately.
tauri-plugin-single-instance = { version = "2", optional = true }
# System-wide screenshot hotkey that works while another application has focus.
# Pinned below 2.4, which requires Tauri 2.12; the built-in browser pins Tauri within 2.11.
tauri-plugin-global-shortcut = { version = "~2.3.2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Source offsets let translation replace prose without rewriting Markdown, code, or link destinations.
pulldown-cmark = { version = "0.13.4", default-features = false }
semver = "1"
# Kimi hooks safely merge into existing config.toml only after parsing validates it.
toml_edit = "0.25"
# Minisign verification of vela-server artifacts: GUI SSH provisioning and headless `vela-server update`.
minisign-verify = "0.2"
# Pure-Rust russh multiplexes exec, SFTP, and forwarding over one connection, currently avoiding Windows
# OpenSSH ControlMaster/ConPTY issues. The ring backend builds without NASM/cmake. GUI only.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"], optional = true }
russh-sftp = { version = "2", optional = true }
# Claude quotas call Anthropic's oauth/usage endpoint through lightweight synchronous rustls HTTP. Codex
# quotas read local rollouts, making this the only project-wide HTTP-client use.
ureq = "2"
# Gitea tokens prefer macOS Keychain/Windows Credential Manager and fall back to plaintext app_settings.
# Tauri and Electron sidecar share the implementation. Linux omits secret-service/dbus and uses fallback.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions"] }
uuid = { workspace = true }
# DeepSeek Harness writes its session logs as zstd-compressed JSONL; already in the tree through dependencies.
zstd = "0.13"
# Server audit-log timestamps use local `yyyy-MM-dd HH:mm:ss` date and time.
time = { workspace = true }
# Lightweight loopback HTTP service receiving official agent hooks and Codex notify callbacks.
tiny_http = { workspace = true }

# Browser remote-access service hosts static frontend assets and bridges commands, events, and PTY over
# WebSocket. An axum Tokio runtime runs on its own thread outside the Tauri event loop.
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
# ReaderStream turns a file handle into a response body, so a download streams instead of being buffered.
tokio-util = { version = "0.7", features = ["io"] }
# Extension traits for axum WebSocket split, next, and send.
futures-util = "0.3"
# Embed ../dist assets in release binaries for offline use, while debug reads disk. Only builds without the
# window use it for the frontend (vela-server, the Electron sidecar); the desktop build serves remote access
# from Tauri's own copy (web/frontend.rs). The `compression` feature stays off in every build: Huorong
# deletes executables whose frontend is stored as large compressed blobs (Trojan/MSIL.ShellLoader.q), so
# vela-server embeds plain bytes and ships inside a zip instead (see server_supply.rs).
rust-embed = { version = "8" }
# SHA-256 for the self-signed-certificate fingerprint (tls.rs) and server-binary manifest verification
# (server_supply.rs); login hashing moved to Argon2id below.
sha2 = "0.10"
# Open the ZCode account `zcode login` seals (AES-256-GCM) to tell its protocol server which plans the
# account holds (agent/zcode_account.rs). Same version the SSH stack already locks.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# Memory-hard Argon2id password hashing so the remote-access password persists only as a PHC verifier
# string (never plaintext) across restarts. Pure Rust, builds in headless --no-default-features too.
argon2 = "0.5"
# Enumerate LAN address candidates for remote access, ordering VPN/tunnel point-to-point interfaces last.
if-addrs = "0.13"
# Parse user-entered remote addresses into url::Url for Tauri WebviewUrl::External.
url = "2"
# Generate an HTTPS self-signed certificate on first launch and reuse it afterward.
rcgen = "0.14"
# Parse certificate PEM to DER and compute the SHA-256 fingerprint used for known-host-style trust.
pem = "3"
# Rustls-backed axum TLS serving over the shared routes.
axum-server = { version = "0.8", features = ["tls-rustls"] }
# Local TLS-terminating tunnel for remote windows, accepting self-signed certificates and copying both ways.
# wry 0.55 WKWebView cannot handle certificate challenges and renders direct self-signed HTTPS blank.
tokio-rustls = "0.26"
# Outbound WebSocket client for the public account tunnel: the host dials the relay and forwards the share
# server's HTTP and WebSocket traffic over it, so no inbound port is needed. TLS uses the platform roots.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Compute headless --serve data paths using the GUI-equivalent platform directory plus identifier.
dirs = "6"
# Browser remote-access E2EE uses NaCl box, wire-compatible with tweetnacl-js. Pairing supplies the server
# public key for ECDH, after which WebSocket frames are transparently encrypted.
crypto_box = { version = "0.9", features = ["std"] }
# Base64 for E2EE text frames; binary PTY frames remain raw.
base64 = "0.22"
# Bounded historical image thumbnails share the existing image version, without unrelated codecs.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Cross-platform process-tree CPU/memory sampling uses sysinfo native APIs rather than external ps. Enable
# only `system`, pin the version for reproducibility, and omit unrelated disk/network/component/user features.
sysinfo = { version = "=0.33.1", default-features = false, features = ["system"] }
# On-the-fly compression of static frontend assets for transfer (see web/static_assets.rs). The bundle is
# embedded uncompressed (see rust-embed and tauri above), so these two codecs are what shrink responses.
# Brotli is preferred and gzip is the fallback for older clients.
brotli = "8"
flate2 = "1"
# Verified, application-owned CodeGraph runtime archives on all supported platforms.
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
# Chinese word segmentation for the word-level search index (search/tokenize.rs). The bundled default
# dictionary is embedded compressed; no runtime download or external service is involved.
jieba-rs = "0.10.3"

# Unix-only rlimit support raises open-file soft limits for inherited agent sessions, avoiding macOS's
# default 256-descriptor failures. Windows has no equivalent.
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"
# Kill the separate process group when canceling Git clone so git-remote children cannot retain pipes.
libc = { workspace = true }

# The GTK version wry already uses; only the GUI connects to the WebKitGTK drag signal (native_drop.rs), so the
# headless vela-server build keeps no GTK dependency.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Change notification for the Files and Git tabs (FSEvents on macOS, ReadDirectoryChangesW on Windows). Linux keeps
# polling: inotify needs a watch per directory and large repositories exhaust the per-user limit.
notify = "8"

[target.'cfg(windows)'.dependencies]
# On-demand full Git Bash self-extractor download with blocking streamed progress, default Windows schannel
# TLS, and JSON parsing for GitHub releases.
reqwest = { version = "0.13", features = ["blocking", "json"] }
# Disable WebView2 browser accelerators that Chromium would consume before frontend keydown, breaking app
# shortcuts. Access ICoreWebView2Settings3 with versions already used by wry to avoid duplicate dependencies.
webview2-com = "0.38"
# Enable Win32 modules used to repair taskbar icons and disable accelerators, sharing the windows dependency.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    # GetFocus, so window reactivation moves focus only when it stopped at the top-level window.
    "Win32_UI_Input_KeyboardAndMouse",
    # GetShortPathNameW, so native hook commands can name the executable without quoting (agent/hook_bridge.rs).
    "Win32_Storage_FileSystem",
    # LoadLibraryW, so the bundled conpty.dll replaces the inbox ConPTY (pty/conpty_win.rs).
    "Win32_System_LibraryLoader",
    # Native WinRT toast notifications with Activated navigation; the official plugin lacks desktop clicks.
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
# Screen capture for the screenshot overlay. macOS uses the system `screencapture` tool instead, and Linux
# is not supported: xcap's Linux backend would require PipeWire and XCB development libraries at build time.
xcap = { version = "0.9", default-features = false }
# Register AppUserModelId in HKCU so unbundled release executables without installer shortcuts can emit
# Windows toasts, which the system otherwise drops. Reuse windows-rs already present through webview2-com.
windows-registry = "0.6"

# Temporary macOS spike using native UNUserNotificationCenter to verify that clicking a self-issued
# notification returns its session ID to Rust. Crates already arrive through Tauri; remove spike features
# after replacing it with the final implementation.
[target.'cfg(target_os = "macos")'.dependencies]
# Catch native exceptions in the spike so unbundled development builds cannot crash the application.
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-user-notifications = { version = "0.3", features = [
    "block2",
    "UNUserNotificationCenter",
    "UNNotification",
    "UNNotificationResponse",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNNotificationSettings",
] }
