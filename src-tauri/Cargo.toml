[package]
name = "velaterm"
version = "0.1.101"
description = "VelaTerm multi-session terminal manager"
authors = ["vlinx"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a known Windows conflict with the binary name.
name = "velaterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# GUI is enabled by default for the desktop app. Minimal vela-server builds use `--no-default-features`,
# omit Tauri/wry/WebKit and GUI modules, and retain CLI paths such as --serve/--version for clean servers.
# Shared pty/agent/web/db/command_core code has no Tauri dependency.
default = ["gui"]
gui = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-single-instance",
    # GUI SSH client verification of vela-server minisign signatures using the updater public key.
    "dep:minisign-verify",
    # Pure-Rust russh transport required only by the GUI SSH client.
    "dep:russh",
    "dep:russh-sftp",
]

[profile.release]
# Strip desktop and minimal-server release artifacts without affecting development/debugging.
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The built-in browser needs unstable Window::add_child multi-WebView APIs. Their signatures may change,
# so the version is pinned within 2.11 and call sites are centralized.
tauri = { version = "2", features = ["unstable"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
# Remote wry windows use the clipboard plugin because macOS WebView rejects asynchronous gesture-free
# navigator.clipboard writes. Runtime capabilities authorize write_text in the remote context.
tauri-plugin-clipboard-manager = { version = "2", optional = true }
# Desktop updater checks latest.json, installs signed packages, and relaunches through the process plugin.
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
# A second `vela <path>` process forwards the path to the running window and exits immediately.
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Kimi hooks safely merge into existing config.toml only after parsing validates it.
toml_edit = "0.25"
# GUI-only minisign verification for the SSH-downloaded vela-server.
minisign-verify = { version = "0.2", optional = true }
# Pure-Rust russh multiplexes exec, SFTP, and forwarding over one connection, currently avoiding Windows
# OpenSSH ControlMaster/ConPTY issues. The ring backend builds without NASM/cmake. GUI only.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"], optional = true }
russh-sftp = { version = "2", optional = true }
# Claude quotas call Anthropic's oauth/usage endpoint through lightweight synchronous rustls HTTP. Codex
# quotas read local rollouts, making this the only project-wide HTTP-client use.
ureq = "2"
# Gitea tokens prefer macOS Keychain/Windows Credential Manager and fall back to plaintext app_settings.
# Tauri and Electron sidecar share the implementation. Linux omits secret-service/dbus and uses fallback.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# Server audit-log timestamps use local `yyyy-MM-dd HH:mm:ss` date and time.
time = { version = "0.3", features = ["local-offset"] }
# Lightweight loopback HTTP service receiving official agent hooks and Codex notify callbacks.
tiny_http = "0.12"

# Browser remote-access service hosts static frontend assets and bridges commands, events, and PTY over
# WebSocket. An axum Tokio runtime runs on its own thread outside the Tauri event loop.
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# Extension traits for axum WebSocket split, next, and send.
futures-util = "0.3"
# Embed compressed ../dist assets in release binaries for offline use and transparent decompression, while
# debug reads disk. Shared by vela-server and desktop --serve, substantially reducing frontend-heavy size.
rust-embed = { version = "8", features = ["compression"] }
# SHA-256 for the self-signed-certificate fingerprint (tls.rs) and server-binary manifest verification
# (server_supply.rs); login hashing moved to Argon2id below.
sha2 = "0.10"
# Memory-hard Argon2id password hashing so the remote-access password persists only as a PHC verifier
# string (never plaintext) across restarts. Pure Rust, builds in headless --no-default-features too.
argon2 = "0.5"
# Enumerate LAN address candidates for remote access, ordering VPN/tunnel point-to-point interfaces last.
if-addrs = "0.13"
# Parse user-entered remote addresses into url::Url for Tauri WebviewUrl::External.
url = "2"
# Generate an HTTPS self-signed certificate on first launch and reuse it afterward.
rcgen = "0.14"
# Parse certificate PEM to DER and compute the SHA-256 fingerprint used for known-host-style trust.
pem = "3"
# Rustls-backed axum TLS serving over the shared routes.
axum-server = { version = "0.8", features = ["tls-rustls"] }
# Local TLS-terminating tunnel for remote windows, accepting self-signed certificates and copying both ways.
# wry 0.55 WKWebView cannot handle certificate challenges and renders direct self-signed HTTPS blank.
tokio-rustls = "0.26"
# Compute headless --serve data paths using the GUI-equivalent platform directory plus identifier.
dirs = "6"
# Browser remote-access E2EE uses NaCl box, wire-compatible with tweetnacl-js. Pairing supplies the server
# public key for ECDH, after which WebSocket frames are transparently encrypted.
crypto_box = { version = "0.9", features = ["std"] }
# Base64 for E2EE text frames; binary PTY frames remain raw.
base64 = "0.22"
# Cross-platform process-tree CPU/memory sampling uses sysinfo native APIs rather than external ps. Enable
# only `system`, pin the version for reproducibility, and omit unrelated disk/network/component/user features.
sysinfo = { version = "=0.33.1", default-features = false, features = ["system"] }

# Unix-only rlimit support raises open-file soft limits for inherited agent sessions, avoiding macOS's
# default 256-descriptor failures. Windows has no equivalent.
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"
# Kill the separate process group when canceling Git clone so git-remote children cannot retain pipes.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# On-demand full Git Bash self-extractor download with blocking streamed progress, default Windows schannel
# TLS, and JSON parsing for GitHub releases.
reqwest = { version = "0.13", features = ["blocking", "json"] }
# Disable WebView2 browser accelerators that Chromium would consume before frontend keydown, breaking app
# shortcuts. Access ICoreWebView2Settings3 with versions already used by wry to avoid duplicate dependencies.
webview2-com = "0.38"
# Enable Win32 modules used to repair taskbar icons and disable accelerators, sharing the windows dependency.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    # Native WinRT toast notifications with Activated navigation; the official plugin lacks desktop clicks.
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
# Register AppUserModelId in HKCU so unbundled release executables without installer shortcuts can emit
# Windows toasts, which the system otherwise drops. Reuse windows-rs already present through webview2-com.
windows-registry = "0.6"

# Temporary macOS spike using native UNUserNotificationCenter to verify that clicking a self-issued
# notification returns its session ID to Rust. Crates already arrive through Tauri; remove spike features
# after replacing it with the final implementation.
[target.'cfg(target_os = "macos")'.dependencies]
# Catch native exceptions in the spike so unbundled development builds cannot crash the application.
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-user-notifications = { version = "0.3", features = [
    "block2",
    "UNUserNotificationCenter",
    "UNNotification",
    "UNNotificationResponse",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNNotificationSettings",
] }
