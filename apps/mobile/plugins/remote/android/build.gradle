plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android' version '2.2.20'
}
android {
    namespace 'com.velaterm.remote'
    compileSdk 36
    defaultConfig { minSdk 24; manifestPlaceholders += rootProject.ext.mobilePushPlaceholders }
    sourceSets { main.assets.srcDirs += '../shared' }
    // "china" bundles Getui and vendor push channels; "play" is the Google Play build without them.
    flavorDimensions += 'store'
    productFlavors {
        china { dimension 'store'; isDefault = true }
        play { dimension 'store' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    kotlinOptions { jvmTarget = '21' }
}
dependencies {
    chinaImplementation 'com.getui:gtsdk:3.3.15.0'
    chinaImplementation 'com.getui:gtc:3.3.3.0'
    chinaImplementation 'com.getui.opt:hwp:3.1.4'
    chinaImplementation 'com.huawei.hms:push:6.12.0.300'
    chinaImplementation 'com.getui.opt:xmp:3.3.7'
    chinaImplementation 'com.assist-v3:oppo:3.6.0'
    chinaImplementation 'com.assist-v3:vivo:3.2.0'
    chinaImplementation 'com.getui.opt:mzp:3.3.2'
    chinaImplementation 'com.getui.opt:honor:3.6.0'
    chinaImplementation 'com.getui.opt:ups:3.0.3'
    chinaImplementation 'com.hihonor.mcs:push:7.0.61.303'
    implementation 'androidx.browser:browser:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation project(':capacitor-android')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.hierynomus:sshj:0.40.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
}
